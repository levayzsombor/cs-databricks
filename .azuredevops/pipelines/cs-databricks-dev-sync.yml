trigger: none
pr: none

pool:
  vmImage: ubuntu-latest

variables:
  - group: databricks-dev
  - name: DATABRICKS_WORKSPACE_NAME
    value: CS-databricks-dev
  - name: DATABRICKS_CLUSTER_NAME
    value: CS-databricks-dev
  - name: DATABRICKS_REPO_BRANCH
    value: main
  - name: DATABRICKS_REPO_PROVIDER
    value: gitHub
  - name: DATABRICKS_WORKSPACE_REPO_PATH
    value: /Repos/levay1990@gmail.com/cs-databricks

steps:
  - checkout: self

  - script: bash .azuredevops/scripts/preflight-required-vars.sh
    displayName: Preflight required variable check
    env:
      AZURE_SERVICE_CONNECTION: $(AZURE_SERVICE_CONNECTION)
      AZURE_RESOURCE_GROUP: $(AZURE_RESOURCE_GROUP)
      AZURE_LOCATION: $(AZURE_LOCATION)
      DATABRICKS_TOKEN: $(DATABRICKS_TOKEN)

  - task: AzureCLI@2
    displayName: Ensure Databricks workspace exists
    inputs:
      azureSubscription: $(AZURE_SERVICE_CONNECTION)
      scriptType: bash
      scriptLocation: scriptPath
      scriptPath: .azuredevops/scripts/ensure-databricks-workspace.sh
    env:
      DATABRICKS_WORKSPACE_NAME: $(DATABRICKS_WORKSPACE_NAME)
      AZURE_RESOURCE_GROUP: $(AZURE_RESOURCE_GROUP)
      AZURE_LOCATION: $(AZURE_LOCATION)

  - script: bash .azuredevops/scripts/install-databricks-cli.sh
    displayName: Install Databricks CLI

  - script: python3 .azuredevops/scripts/ensure-databricks-cluster.py
    displayName: Ensure Databricks cluster is active
    env:
      DATABRICKS_HOST: $(DATABRICKS_HOST)
      DATABRICKS_TOKEN: $(DATABRICKS_TOKEN)
      DATABRICKS_CLUSTER_NAME: $(DATABRICKS_CLUSTER_NAME)

  - script: python3 .azuredevops/scripts/sync-databricks-repo.py
    displayName: Sync main branch in Databricks Repo
    env:
      DATABRICKS_HOST: $(DATABRICKS_HOST)
      DATABRICKS_TOKEN: $(DATABRICKS_TOKEN)
      DATABRICKS_REPO_BRANCH: $(DATABRICKS_REPO_BRANCH)
      DATABRICKS_REPO_PROVIDER: $(DATABRICKS_REPO_PROVIDER)
      BUILD_REPOSITORY_NAME: $(Build.Repository.Name)
      REPO_URL: $(Build.Repository.Uri)

  - script: python3 .azuredevops/scripts/update-workspace-repo-folder.py
    displayName: Update existing Databricks workspace repo folder
    env:
      DATABRICKS_HOST: $(DATABRICKS_HOST)
      DATABRICKS_TOKEN: $(DATABRICKS_TOKEN)
      DATABRICKS_REPO_BRANCH: $(DATABRICKS_REPO_BRANCH)
      DATABRICKS_WORKSPACE_REPO_PATH: $(DATABRICKS_WORKSPACE_REPO_PATH)

parameters:
  - name: targetName
    type: string
  - name: environmentName
    type: string

stages:
  - stage: Deploy_${{ parameters.targetName }}
    displayName: Deploy to ${{ parameters.environmentName }}
    jobs:
      - deployment: DeployDatabricksBundle
        displayName: Deploy Databricks bundle
        environment: ${{ parameters.environmentName }}
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - task: UsePythonVersion@0
                  displayName: Use Python 3.11
                  inputs:
                    versionSpec: '3.11'

                - script: bash .azuredevops/scripts/install-python-deps.sh
                  displayName: Install Python dependencies

                - script: bash .azuredevops/scripts/install-databricks-cli.sh
                  displayName: Install Databricks CLI

                - script: bash .azuredevops/scripts/validate-bundle.sh "${{ parameters.targetName }}"
                  displayName: Validate bundle for target
                  env:
                    DATABRICKS_HOST: $(DATABRICKS_HOST)
                    DATABRICKS_TOKEN: $(DATABRICKS_TOKEN)

                - script: bash .azuredevops/scripts/deploy-bundle.sh "${{ parameters.targetName }}"
                  displayName: Deploy bundle for target
                  env:
                    DATABRICKS_HOST: $(DATABRICKS_HOST)
                    DATABRICKS_TOKEN: $(DATABRICKS_TOKEN)

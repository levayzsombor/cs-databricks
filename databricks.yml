# This is a Declarative Automation Bundle definition for cs-databricks.
# The Databricks extension requires databricks.yml configuration file.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.

bundle:
  name: cs-databricks

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://adb-7405618927765922.2.azuredatabricks.net

  ua:
    workspace:
      host: ${env.DATABRICKS_HOST}

  staging:
    workspace:
      host: ${env.DATABRICKS_HOST}

  prod:
    workspace:
      host: ${env.DATABRICKS_HOST}

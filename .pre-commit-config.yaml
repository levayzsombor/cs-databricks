repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff-format
        entry: ruff format
        language: system
        types: [python]

      - id: shfmt
        name: shfmt
        entry: shfmt -w -i 2 -ci
        language: system
        types: [shell]

      - id: shellcheck
        name: shellcheck
        entry: shellcheck -e SC1091
        language: system
        types: [shell]

      - id: actionlint
        name: actionlint
        entry: actionlint
        language: system
        files: ^\.github/workflows/.*\.ya?ml$

      - id: yamllint
        name: yamllint
        entry: yamllint -c .yamllint
        language: system
        files: ^.*\.ya?ml$

      - id: eslint
        name: eslint
        entry: npx eslint --fix
        language: system
        files: ^.*\.(js|jsx|ts|tsx)$

      - id: prettier
        name: prettier
        entry: npx prettier --write
        language: system
        files: ^.*\.(js|jsx|ts|tsx|json|ya?ml|md)$

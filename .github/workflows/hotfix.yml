name: "Merge hotfix branch into target branch"

"on":
  workflow_dispatch:
    inputs:
      source_branch:
        description: Source branch to merge from
        required: true
        type: string
      target_branch:
        description: Target branch to merge into
        required: true
        type: string

concurrency:
  group: "hotfix-${{ inputs.target_branch }}-mutations"
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: read

jobs:
  validate-and-merge-hotfix:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate hotfix source branch
        uses: actions/github-script@v7
        env:
          SOURCE_BRANCH: ${{ inputs.source_branch }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
        with:
          script: |
            const validate = require('./.github/workflows/scripts/hotfix/validate-hotfix-source-branch.cjs');
            await validate({ github, context, core });

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: "${{ inputs.target_branch }}"

      - name: Configure Git identity
        run: bash .github/workflows/scripts/common/configure-git.sh

      - name: Merge source branch into target branch
        env:
          SOURCE_BRANCH: ${{ inputs.source_branch }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
        run: bash .github/workflows/scripts/hotfix/merge-source-into-target.sh
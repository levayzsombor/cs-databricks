name: Sync main into ua

on:
  workflow_dispatch:

concurrency:
  group: ua-branch-mutations
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync-main-into-ua:
    runs-on: ubuntu-latest

    steps:
      - name: Validate dispatch branch
        run: bash .github/workflows/scripts/common/validate-dispatch-branch.sh main

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Configure Git identity
        run: bash .github/workflows/scripts/common/configure-git.sh

      - name: Ensure ua branch exists
        run: bash .github/workflows/scripts/ua-sync-main/ensure-ua-branch.sh

      - name: Merge main into ua
        run: bash .github/workflows/scripts/ua-sync-main/merge-main-into-ua.sh

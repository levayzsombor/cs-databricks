name: PR to dev

on:
  pull_request:
    branches:
      - prod
    types:
      - opened
      - reopened
      - synchronize

env:
  AZDO_ORG_URL: ${{ secrets.AZDO_ORG_URL }}
  AZDO_PROJECT: ${{ secrets.AZDO_PROJECT }}
  AZDO_GITHUB_SERVICE_CONNECTION: ${{ secrets.AZDO_GITHUB_SERVICE_CONNECTION }}
  TARGET_ENV: dev
  TEST_RUN_TYPE: PR_TO_DEV

concurrency:
  group: 'pr-to-dev'
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  pr-to-dev:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Local environment setup (for GitHub Job VM)
        run: bash .github/workflows/scripts/common/local-env-setup.sh

      - name: Get source and target branch names
        run: bash .github/workflows/scripts/common/get-branch-names.sh

      - name: Check if source branch name is valid for dev
        run: python .github/workflows/scripts/common/check-branch-name.py

      - name: Lint and Format check (on GitHub Job VM)
        run: bash .github/workflows/scripts/common/lint-format-check.sh

      - name: Run tests on local environment (on GitHub Job VM)
        run: bash .github/workflows/scripts/common/run-tests.sh

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Install Azure DevOps extension
        run: bash .github/workflows/scripts/azure/install-azure-devops-extension.sh

      - name: Run Azure DevOps pipeline to save test results to artifact storage
        run: bash .github/workflows/scripts/azure/save-test-results.sh

name: Merge hotfix PR branch into ua

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to merge into ua
        required: true
        type: number

concurrency:
  group: ua-branch-mutations
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  validate-and-promote-hotfix:
    runs-on: ubuntu-latest

    steps:
      - name: Validate hotfix PR state
        id: validate
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = Number(core.getInput('pr_number'));
            if (!Number.isInteger(prNumber) || prNumber <= 0) {
              core.setFailed('pr_number must be a positive integer.');
              return;
            }

            const { owner, repo } = context.repo;

            const { data: pr } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: prNumber,
            });

            if (pr.state !== 'open') {
              core.setFailed(`PR #${prNumber} is not open.`);
              return;
            }

            const labels = pr.labels.map((l) => l.name.toLowerCase());
            if (!labels.includes('hotfix')) {
              core.setFailed(`PR #${prNumber} does not have the hotfix label.`);
              return;
            }

            if (!pr.head.repo || pr.head.repo.full_name !== `${owner}/${repo}`) {
              core.setFailed('Hotfix branch must come from the same repository.');
              return;
            }

            const { data: reviews } = await github.rest.pulls.listReviews({
              owner,
              repo,
              pull_number: prNumber,
              per_page: 100,
            });

            const latestByUser = new Map();
            for (const review of reviews) {
              latestByUser.set(review.user.login, review.state);
            }

            const hasBlockingChangeRequest = [...latestByUser.values()].includes('CHANGES_REQUESTED');
            const approvalCount = [...latestByUser.values()].filter((state) => state === 'APPROVED').length;

            if (hasBlockingChangeRequest) {
              core.setFailed(`PR #${prNumber} has an active CHANGES_REQUESTED review.`);
              return;
            }

            if (approvalCount < 1) {
              core.setFailed(`PR #${prNumber} must have at least one approval.`);
              return;
            }

            core.setOutput('head_ref', pr.head.ref);
            core.info(`PR #${prNumber} validated. Branch: ${pr.head.ref}`);

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Ensure ua branch exists
        run: |
          set -euo pipefail
          git fetch origin main

          if git ls-remote --exit-code --heads origin ua > /dev/null; then
            echo "ua branch already exists"
          else
            git checkout -B ua origin/main
            git push origin ua
          fi

      - name: Create or update hotfix promotion PR to ua
        id: create_pr
        uses: actions/github-script@v7
        env:
          HOTFIX_BRANCH: ${{ steps.validate.outputs.head_ref }}
          SOURCE_PR_NUMBER: ${{ inputs.pr_number }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const headRef = process.env.HOTFIX_BRANCH;
            const sourcePrNumber = Number(process.env.SOURCE_PR_NUMBER);
            const head = `${owner}:${headRef}`;
            const base = 'ua';

            const existing = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: 'open',
              head,
              base,
              per_page: 100,
            });

            if (existing.length > 0) {
              core.setOutput('promotion_pr_number', String(existing[0].number));
              core.setOutput('promotion_pr_url', existing[0].html_url);
              core.info(`Existing promotion PR found: #${existing[0].number}`);
              return;
            }

            try {
              const { data: pr } = await github.rest.pulls.create({
                owner,
                repo,
                title: `[UA Hotfix] PR #${sourcePrNumber} -> ua`,
                body: `Automated UA hotfix promotion from branch ${headRef}.\n\nSource PR: #${sourcePrNumber}`,
                head: headRef,
                base,
                maintainer_can_modify: false,
              });

              core.setOutput('promotion_pr_number', String(pr.number));
              core.setOutput('promotion_pr_url', pr.html_url);
              core.info(`Created promotion PR #${pr.number} (${pr.html_url})`);
            } catch (error) {
              if (error.status === 422) {
                core.info('No changes to promote from hotfix branch to ua.');
                core.setOutput('promotion_pr_number', '');
                core.setOutput('promotion_pr_url', '');
                return;
              }
              throw error;
            }

      - name: Comment success on source PR
        if: ${{ success() }}
        uses: actions/github-script@v7
        env:
          SOURCE_PR_NUMBER: ${{ inputs.pr_number }}
          PROMOTION_PR_NUMBER: ${{ steps.create_pr.outputs.promotion_pr_number }}
          PROMOTION_PR_URL: ${{ steps.create_pr.outputs.promotion_pr_url }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const sourcePrNumber = Number(process.env.SOURCE_PR_NUMBER);
            const promotionPrNumber = process.env.PROMOTION_PR_NUMBER;
            const promotionPrUrl = process.env.PROMOTION_PR_URL;

            const body = promotionPrNumber
              ? `UA hotfix promotion PR created/updated: #${promotionPrNumber} (${promotionPrUrl})`
              : 'UA hotfix workflow completed. No changes were found to promote to ua.';

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: sourcePrNumber,
              body,
            });

      - name: Comment failure on source PR
        if: ${{ failure() }}
        uses: actions/github-script@v7
        env:
          SOURCE_PR_NUMBER: ${{ inputs.pr_number }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const sourcePrNumber = Number(process.env.SOURCE_PR_NUMBER);
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: sourcePrNumber,
              body: `UA hotfix promotion failed. See workflow logs: ${runUrl}`,
            });

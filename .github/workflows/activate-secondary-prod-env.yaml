name: Activate secondary prod environment 

on:
  workflow_dispatch:

concurrency:
  group: "activate-secondary-prod-env"
  cancel-in-progress: false

env:
    AZURE_DEVOPS_EXT_PAT: ${{ secrets.AZDO_PAT }}
    AZDO_ORG_URL: ${{ secrets.AZDO_ORG_URL }}
    AZDO_PROJECT: ${{ secrets.AZDO_PROJECT }}
    AZDO_GITHUB_SERVICE_CONNECTION: ${{ secrets.AZDO_GITHUB_SERVICE_CONNECTION }}
    TARGET_ENV: PROD

permissions:
  contents: read

jobs:
  activate-secondary-prod-env:
    runs-on: ubuntu-latest

    steps:

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Install Azure DevOps extension
        run: bash .github/workflows/scripts/azure/install-azure-devops-extension.sh

      - name: Run Azure DevOps pipeline start the secondary prod environment
        run: bash .github/workflows/scripts/azure/run-azdo-pipeline.sh
        env:
          PIPELINE_NAME: cs-start-secondary-prod-env.yml

      - name: Run Azure DevOps pipeline run smoke tests on the secondary prod environment
        run: bash .github/workflows/scripts/azure/run-azdo-pipeline.sh
        env:
          PIPELINE_NAME: cs-run-smoke-tests-secondary-prod-env.yml
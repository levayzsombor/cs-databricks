name: "Merge release branch into staging"

"on":
  workflow_dispatch:
    inputs:
      source_branch:
        description: Source branch to merge from
        required: true
        type: string

concurrency:
  group: "staging-branch-mutations"
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  validate-and-merge-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: "staging"

      - name: Validate release source branch
        env:
          SOURCE_BRANCH: "${{ inputs.source_branch }}"
        run: bash .github/workflows/scripts/release-to-staging/validate-release-source-branch.sh

      - name: Configure Git identity
        run: bash .github/workflows/scripts/common/configure-git.sh

      - name: Merge source branch into staging
        env:
          SOURCE_BRANCH: "${{ inputs.source_branch }}"
        run: bash .github/workflows/scripts/release-to-staging/merge-source-into-staging.sh
name: Sync staging into prod

"on":
  workflow_dispatch:

concurrency:
  group: prod-branch-mutations
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync-staging-into-prod:
    runs-on: ubuntu-latest

    steps:
      - name: Validate dispatch branch
        run: bash .github/workflows/scripts/common/validate-dispatch-branch.sh staging

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: staging

      - name: Configure Git identity
        run: bash .github/workflows/scripts/common/configure-git.sh

      - name: Ensure prod branch exists
        run: bash .github/workflows/scripts/prod-sync-staging/ensure-prod-branch.sh

      - name: Merge staging into prod
        run: bash .github/workflows/scripts/prod-sync-staging/merge-staging-into-prod.sh
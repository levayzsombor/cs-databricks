name: 'Create prerelease branch from feature tags'

on:
  workflow_dispatch:
    inputs:
      feature_tags:
        description: 'Comma-separated git tags (e.g. feature-a,feature-b)'
        required: true
        type: string

concurrency:
  group: 'prerelease-branch'
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  create-prerelease-branch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git identity
        run: bash .github/workflows/scripts/common/configure-git.sh

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Local environment setup (for GitHub Job VM)
        run: bash .github/workflows/scripts/common/local-env-setup.sh

      - name: Get the oldest approved tags hash from the repository
        run: python .github/workflows/scripts/dev/get-oldest-approved-tag.py

      - name: Check feature tags validity
        run: python .github/workflows/scripts/dev/check-feature-tags.py

      - name: Create prerelease branch from feature tags
        run: python .github/workflows/scripts/dev/create-prerelease-branch.py

      - name: Swap the prerelease branch
        run: bash .github/workflows/scripts/common/swap-to-branch.sh

      - name: Create pull request for prerelease branch
        run: python .github/workflows/scripts/common/create-pr.py

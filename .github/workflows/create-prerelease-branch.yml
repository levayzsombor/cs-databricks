name: "Create prerelease branch from feature tags"

"on":
  workflow_dispatch:
    inputs:
      feature_tags:
        description: "Comma-separated git tags (e.g. feature-a,feature-b)"
        required: true
        type: string

concurrency:
  group: "release-branch-mutations"
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: read

jobs:
  create-release-branch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git identity
        run: bash .github/workflows/scripts/common/configure-git.sh

      - name: Create base for prerelease branch
        id: create-base
        run: bash .github/workflows/scripts/merge-to-main/find-base-for-prerelease-branch.sh

      - name: Get tags and hashes from base to head
        id: get-tags-and-hashes
        run: bash .github/workflows/scripts/common/get-tags-and-hashes.sh

      - name: Validate that approved feature tags exist
        id: validate-tags
        run: bash .github/workflows/scripts/common/validate-tags.sh

      - name: Collect implemented feature tags, version-update tags and hotfix tags
        id: collect-must-have-tags
        run: bash .github/workflows/scripts/merge-to-main/collect-must-have-tags.sh

      - name: Get tags approved by user acceptance
        id: get-approved-tags
        run: bash .github/workflows/scripts/merge-to-main/get-tags.sh

      - name: Order tags by date
        id: order-tags
        run: bash .github/workflows/scripts/merge-to-main/order-tags.sh

      - name: Check if every commit starting from base has a tag
        id: check-tags
        run: bash .github/workflows/scripts/merge-to-main/check-tags.sh

      - name: Cherry-pick commits from tags to prerelease branch
        id: cherry-pick
        run: bash .github/workflows/scripts/merge-to-main/cherry-pick-tags.sh

      - name: Create pull request for prerelease branch
        id: create-pr
        run: bash .github/workflows/scripts/create-release/create-pr.sh
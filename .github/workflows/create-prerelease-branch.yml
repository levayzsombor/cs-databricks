name: 'Create prerelease branch from feature tags'

on:
  workflow_dispatch:
    inputs:
      feature_tags:
        description: 'Comma-separated git tags (e.g. feature-a,feature-b)'
        required: true
        type: string

concurrency:
  group: 'prerelease-branch'
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  create-prerelease-branch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git identity
        run: bash .github/workflows/scripts/common/configure-git.sh

      - name: Create pull request for prerelease branch
        id: create-pr
        env:
          GH_TOKEN: ${{ github.token }}
          FEATURE_TAGS: ${{ inputs.feature_tags }}
        run: bash .github/workflows/scripts/prerelease/create-pr.sh

name: 'Deploy Monitoring Dashboard to App Service'

on:
  push:
    branches:
      - dev
      - staging
      - prod
    paths:
      - 'src/monitoring/**'
      - '.github/workflows/deploy-app-service.yml'
      - 'package.json'
      - 'package-lock.json'

concurrency:
  group: 'deploy-app-service-${{ github.ref }}'
  cancel-in-progress: false

permissions:
  contents: read

env:
  LOG_ANALYTICS_WORKSPACE_ID: 7d0cb39c-348d-4863-91e1-efefc333fc11
  REGISTRY_URL: acrcountrystatsshow.azurecr.io
  IMAGE_NAME: countrystats-dashboard

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: ${{ github.ref == 'refs/heads/prod' && 'production' || 'staging' }}

    outputs:
      image-tag: ${{ steps.image.outputs.tag }}
      app-service-name: ${{ steps.determine-target.outputs.app-service-name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Determine target environment
        id: determine-target
        run: .github/workflows/scripts/ci_determine_app_service_target.sh "${{ github.ref }}"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Lint
        run: npm run lint 2>&1 || true # Don't fail on lint warnings

      - name: Run tests
        run: npm test -- --passWithNoTests --coverage 2>&1 || true

      - name: Build React app
        run: npm run build
        env:
          VITE_LOG_ANALYTICS_WORKSPACE_ID: ${{ env.LOG_ANALYTICS_WORKSPACE_ID }}
          VITE_DATABRICKS_DEV_HOST: adb-7405618359915433.13.azuredatabricks.net
          VITE_DATABRICKS_UA_HOST: adb-7405606676358457.17.azuredatabricks.net
          VITE_DATABRICKS_STAGING_HOST: adb-7405615578261463.3.azuredatabricks.net
          VITE_DATABRICKS_BLUE_HOST: adb-7405606075384170.10.azuredatabricks.net
          VITE_DATABRICKS_GREEN_HOST: adb-7405610871676215.15.azuredatabricks.net

      - name: Generate image tag
        id: image
        run: .github/workflows/scripts/ci_generate_image_tag.sh "${{ github.ref_name }}" "${{ github.sha }}"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to Azure Container Registry
        uses: azure/docker-login@83efeb77770c98b620c73055fbb59b2847e17dc0 # v1
        with:
          login-server: ${{ env.REGISTRY_URL }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: ./Dockerfile.dashboard
          push: true
          tags: |
            ${{ env.REGISTRY_URL }}/${{ env.IMAGE_NAME }}:${{ steps.image.outputs.tag }}
            ${{ env.REGISTRY_URL }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Login to Azure
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to App Service slot
        id: deploy
        run: python .github/workflows/scripts/deploy-app-service.py --app-service-name "${{ steps.determine-target.outputs.app-service-name }}" --resource-group countrystats-showcase --image-url "${{ env.REGISTRY_URL }}/${{ env.IMAGE_NAME }}:${{ steps.image.outputs.tag }}" --slot "${{ steps.determine-target.outputs.slot }}" --output-file deployment-result.json

      - name: Run health checks on deployed slot
        id: health-check
        run: python .github/workflows/scripts/health-check-app-service.py --app-service-name "${{ steps.determine-target.outputs.app-service-name }}" --slot "${{ steps.determine-target.outputs.slot }}" --resource-group countrystats-showcase --timeout 300

      - name: Swap slots (production only)
        if: github.ref == 'refs/heads/prod'
        id: swap
        run: python .github/workflows/scripts/swap-app-service-slots.py --app-service-name "${{ steps.determine-target.outputs.app-service-name }}" --resource-group countrystats-showcase

      - name: Verify post-swap health
        if: github.ref == 'refs/heads/prod'
        run: python .github/workflows/scripts/health-check-app-service.py --app-service-name "${{ steps.determine-target.outputs.app-service-name }}" --slot production --resource-group countrystats-showcase --timeout 300

      - name: Send deployment logs to Log Analytics
        if: always()
        env:
          LOG_ANALYTICS_WORKSPACE_KEY: ${{ secrets.LOG_ANALYTICS_WORKSPACE_KEY }}
        run: .github/workflows/scripts/ci_send_logs.sh "${{ env.LOG_ANALYTICS_WORKSPACE_ID }}" "${{ env.LOG_ANALYTICS_WORKSPACE_KEY }}" "${{ steps.determine-target.outputs.environment }}" "dashboard_${{ job.status }}" deployment-result.json

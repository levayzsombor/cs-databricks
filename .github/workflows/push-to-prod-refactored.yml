name: 'Push to prod (Blue-Green Strategy)'

on:
  pull_request:
    branches:
      - prod
    types:
      - closed

concurrency:
  group: 'push-to-prod'
  cancel-in-progress: false

permissions:
  contents: read

env:
  LOG_ANALYTICS_WORKSPACE_ID: 7d0cb39c-348d-4863-91e1-efefc333fc11

jobs:
  determine-target:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      target-env: ${{ steps.determine.outputs.target-env }}
      databricks-host: ${{ steps.determine.outputs.databricks-host }}
      databricks-pat-secret: ${{ steps.determine.outputs.databricks-pat-secret }}
    steps:
      - name: Determine target environment (BLUE or GREEN)
        id: determine
        run: .github/workflows/scripts/ci_determine_prod_target.sh

  deploy-to-prod:
    if: github.event.pull_request.merged == true
    needs: determine-target
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      issues: write
    environment:
      name: production # Require approval for production

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install databricks-sdk requests

      - name: Run full test suite
        run: pip install -r requirements-dev.txt && pytest tests/ -v --cov=src --cov-report=term-missing

      - name: Deploy notebooks to Databricks ${{ needs.determine-target.outputs.target-env }}
        id: deploy
        env:
          DATABRICKS_PAT: ${{ secrets[needs.determine-target.outputs.databricks-pat-secret] }}
          PR_HEAD_REF: ${{ github.head_ref }}
        run: .github/workflows/scripts/ci_deploy_notebooks.sh "${{ needs.determine-target.outputs.target-env }}" "$PR_HEAD_REF" "${{ needs.determine-target.outputs.databricks-host }}" deployment-result.json false

      - name: Run health checks
        id: health-check
        env:
          DATABRICKS_PAT: ${{ secrets[needs.determine-target.outputs.databricks-pat-secret] }}
        run: .github/workflows/scripts/ci_health_check.sh "${{ needs.determine-target.outputs.target-env }}" "${{ needs.determine-target.outputs.databricks-host }}" 300

      - name: Run smoke tests
        env:
          DATABRICKS_PAT: ${{ secrets[needs.determine-target.outputs.databricks-pat-secret] }}
        run: .github/workflows/scripts/ci_smoke_tests.sh "${{ needs.determine-target.outputs.target-env }}" "${{ needs.determine-target.outputs.databricks-host }}"

      - name: Send deployment logs to Log Analytics
        if: always()
        env:
          LOG_ANALYTICS_WORKSPACE_KEY: ${{ secrets.LOG_ANALYTICS_WORKSPACE_KEY }}
        run: .github/workflows/scripts/ci_send_logs.sh "${{ env.LOG_ANALYTICS_WORKSPACE_ID }}" "${{ env.LOG_ANALYTICS_WORKSPACE_KEY }}" "${{ needs.determine-target.outputs.target-env }}" "${{ job.status }}" deployment-result.json

      - name: Notify on success
        if: success()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.ref,
              environment: 'production',
              description: 'Production deployment',
              production_environment: true,
              auto_merge: false
            })

            console.log('✅ Production deployment successful')

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `❌ **PROD Deployment Failed**\n\nCheck workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`
            })

name: Update UA from dev HEAD

on:
  workflow_dispatch:

env:
  AZURE_DEVOPS_EXT_PAT: ${{ secrets.AZDO_PAT }}
  AZDO_ORG_URL: ${{ secrets.AZDO_ORG_URL }}
  AZDO_PROJECT: ${{ secrets.AZDO_PROJECT }}
  AZDO_GITHUB_SERVICE_CONNECTION: ${{ secrets.AZDO_GITHUB_SERVICE_CONNECTION }}
  TARGET_ENV: UA

concurrency:
  group: 'update-ua-from-dev'
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update-ua-from-dev:
    runs-on: ubuntu-latest

    steps:
      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Install Azure DevOps extension
        run: bash .github/workflows/scripts/azure/install-azure-devops-extension.sh

      - name: Run Azure DevOps pipeline to update Databricks workspace with changes from dev
        run: bash .github/workflows/scripts/azure/update-workspace.sh
        env:
          PIPELINE_BRANCH: dev

      - name: Execute Azure DevOps pipeline to run tests on ua
        run: bash .github/workflows/scripts/azure/run-test.sh
        env:
          PIPELINE_BRANCH: dev

apiVersion: v1
kind: ConfigMap
metadata:
  name: '{{ include "databricks-jobs.fullname" . }}-config'
  namespace: '{{ .Release.Namespace }}'
  labels:
    helm.sh/chart: '{{ include "databricks-jobs.chart" . }}'
    app.kubernetes.io/name: '{{ include "databricks-jobs.name" . }}'
    app.kubernetes.io/instance: '{{ .Release.Name }}'
    app.kubernetes.io/version: '{{ .Chart.AppVersion }}'
    app.kubernetes.io/managed-by: '{{ .Release.Service }}'
data:
  # Job definitions as JSON for deployment
  jobs.json: |
    {
      "jobs": [
        {{- range $jobName, $jobConfig := .Values.jobs }}
        {{- if $jobConfig.enabled }}
        {
          "name": "{{ $jobName }}-{{ .Release.Name }}",
          "description": "{{ $jobConfig.description }}",
          "schedule": {
            "quartz_cron_expression": "{{ $jobConfig.schedule.quartz_cron_expression }}",
            "timezone_id": "{{ $jobConfig.schedule.timezone_id }}"
          },
          "new_cluster": {
            "spark_version": "{{ $jobConfig.cluster.spark_version }}",
            "node_type_id": "{{ $jobConfig.cluster.node_type_id }}",
            "num_workers": {{ $jobConfig.cluster.num_workers }},
            "driver_node_type_id": "{{ $jobConfig.cluster.driver_node_type_id }}",
            "idle_timeout_minutes": {{ $jobConfig.cluster.idle_timeout_minutes }}
          },
          "notebook_task": {
            "notebook_path": "{{ $jobConfig.notebook_path }}"
          },
          "max_concurrent_runs": {{ $jobConfig.max_concurrent_runs }},
          "tasks": []
        }{{ if not (eq (len $jobConfig) (len (last (keys $.Values.jobs)))) }},{{ end }}
        {{- end }}
        {{- end }}
      ]
    }

  # Environment configuration
  environments.json: |
    {
      "environments": {{ .Values.environments | toJson }}
    }

  # Logging configuration
  logging.json: |
    {
      "logging": {{ .Values.logging | toJson }}
    }
